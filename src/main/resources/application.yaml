server:
  port: ${SERVER_PORT:${PORT:8081}}

spring:
  application:
    name: SeekersStop

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: "${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/job_portal}}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 360000000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  storage:
    root: ${CV_STORAGE_ROOT:uploads}
