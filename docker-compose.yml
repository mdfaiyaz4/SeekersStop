services:

  mysql:
    image: mysql:8.0
    container_name: seekersstop-mysql

    environment:
      MYSQL_DATABASE: job_portal
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - seekersstop-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "seekersstop", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  app:
    build: .
    container_name: seekersstop-app

    ports:
      - "8080:8080"

    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - seekersstop-network


volumes:
  mysql-data:


networks:
  seekersstop-network: